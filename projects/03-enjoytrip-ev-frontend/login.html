<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>로그인 · EnjoyTrip EV</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" />
    <link rel="stylesheet" href="assets/css/style.css" />
  </head>
  <body>
    <header id="app-header"></header>

    <main class="auth-wrap">
      <h1 class="mb-1">로그인</h1>
      <p class="text-body-secondary mb-4">여행 계획과 핫플레이스를 저장하려면 로그인하세요.</p>

      <div id="form-alert" class="alert alert-danger d-none" role="alert"></div>

      <form id="login-form" novalidate>
        <div class="mb-3">
          <label for="id" class="form-label">아이디</label>
          <input id="id" name="id" class="form-control" autocomplete="username" required />
          <div class="invalid-feedback"></div>
        </div>
        <div class="mb-3">
          <label for="password" class="form-label">비밀번호</label>
          <input id="password" name="password" type="password" class="form-control" autocomplete="current-password" required />
          <div class="invalid-feedback"></div>
        </div>
        <div class="form-check mb-3">
          <input class="form-check-input" type="checkbox" id="remember" />
          <label class="form-check-label" for="remember">아이디 저장</label>
        </div>
        <button class="btn btn-primary w-100 py-2" type="submit">로그인</button>
      </form>

      <div class="d-flex justify-content-between small mt-3">
        <a href="find-password.html">비밀번호 찾기</a>
        <a href="signup.html">회원가입</a>
      </div>
    </main>

    <footer id="app-footer"></footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="assets/js/core/layout.js"></script>
    <script type="module" src="assets/js/pages/login.js"></script>
  </body>
</html>
