<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>회원가입 · EnjoyTrip EV</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" />
    <link rel="stylesheet" href="assets/css/style.css" />
  </head>
  <body>
    <header id="app-header"></header>

    <main class="auth-wrap">
      <h1 class="mb-1">회원가입</h1>
      <p class="text-body-secondary mb-4">가입 정보는 이 브라우저(localStorage)에만 저장됩니다.</p>

      <form id="signup-form" novalidate>
        <div class="mb-3">
          <label for="id" class="form-label">아이디</label>
          <div class="input-group has-validation">
            <input id="id" name="id" class="form-control" autocomplete="username" maxlength="16" required />
            <button class="btn btn-outline-secondary" type="button" id="btn-check-id">중복 확인</button>
            <div class="invalid-feedback"></div>
          </div>
          <div class="form-hint mt-1" id="id-hint">영문 소문자/숫자 4~16자</div>
        </div>
        <div class="mb-3">
          <label for="password" class="form-label">비밀번호</label>
          <input id="password" name="password" type="password" class="form-control" autocomplete="new-password" maxlength="20" required />
          <div class="invalid-feedback"></div>
          <div class="form-hint mt-1">영문과 숫자를 포함한 8~20자</div>
        </div>
        <div class="mb-3">
          <label for="password2" class="form-label">비밀번호 확인</label>
          <input id="password2" name="password2" type="password" class="form-control" autocomplete="new-password" maxlength="20" required />
          <div class="invalid-feedback"></div>
        </div>
        <div class="mb-3">
          <label for="name" class="form-label">이름</label>
          <input id="name" name="name" class="form-control" autocomplete="name" maxlength="20" required />
          <div class="invalid-feedback"></div>
        </div>
        <div class="mb-4">
          <label for="email" class="form-label">이메일</label>
          <input id="email" name="email" type="email" class="form-control" autocomplete="email" required />
          <div class="invalid-feedback"></div>
          <div class="form-hint mt-1">비밀번호를 찾을 때 사용합니다.</div>
        </div>
        <button class="btn btn-primary w-100 py-2" type="submit">가입하기</button>
      </form>
      <p class="small text-center mt-3">이미 계정이 있나요? <a href="login.html">로그인</a></p>
    </main>

    <footer id="app-footer"></footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="assets/js/core/layout.js"></script>
    <script type="module" src="assets/js/pages/signup.js"></script>
  </body>
</html>
