<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>게시글 · EnjoyTrip EV</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" />
    <link rel="stylesheet" href="assets/css/style.css" />
  </head>
  <body>
    <header id="app-header"></header>

    <main class="page-wrap" style="max-width: 800px">
      <article id="post" aria-live="polite">
        <a class="small fw-medium text-decoration-none" id="post-board" href="board.html"></a>
        <h1 class="page-title mt-1 mb-2" id="post-title"></h1>
        <p class="small text-body-secondary border-bottom pb-3 mb-4 d-flex flex-wrap gap-3" id="post-meta"></p>
        <div class="post-body" id="post-body"></div>
      </article>
      <div class="d-flex gap-2 border-top pt-4 mt-4">
        <a class="btn btn-outline-secondary" id="btn-list" href="board.html">목록</a>
        <span class="flex-fill"></span>
        <a class="btn btn-outline-primary d-none" id="btn-edit" href="#">수정</a>
        <button class="btn btn-outline-danger d-none" id="btn-delete" type="button">삭제</button>
      </div>
    </main>

    <footer id="app-footer"></footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="assets/js/core/layout.js"></script>
    <script type="module" src="assets/js/pages/board-view.js"></script>
  </body>
</html>
