<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>여행 계획 · EnjoyTrip EV</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" />
    <link rel="stylesheet" href="assets/css/style.css" />
  </head>
  <body>
    <header id="app-header"></header>

    <main class="app-shell">
      <section class="app-panel" aria-labelledby="panel-title">
        <div class="app-panel__head">
          <h1 id="panel-title" class="visually-hidden">여행 계획</h1>
          <ul class="nav panel-tabs" role="tablist">
            <li class="nav-item" role="presentation">
              <button class="nav-link" id="tab-find" data-bs-toggle="tab" data-bs-target="#pane-find" type="button" role="tab" aria-controls="pane-find" aria-selected="false">장소 찾기</button>
            </li>
            <li class="nav-item" role="presentation">
              <button class="nav-link active" id="tab-plan" data-bs-toggle="tab" data-bs-target="#pane-plan" type="button" role="tab" aria-controls="pane-plan" aria-selected="true">내 계획 (<span id="stop-count">0</span>)</button>
            </li>
            <li class="nav-item" role="presentation">
              <button class="nav-link" id="tab-saved" data-bs-toggle="tab" data-bs-target="#pane-saved" type="button" role="tab" aria-controls="pane-saved" aria-selected="false">저장 목록</button>
            </li>
          </ul>
        </div>

        <div class="app-panel__body tab-content">
          <!-- 장소 찾기 -->
          <div class="tab-pane fade" id="pane-find" role="tabpanel" aria-labelledby="tab-find" tabindex="0">
            <form id="find-form" class="p-3 vstack gap-2 border-bottom" role="search">
              <div class="input-group">
                <label class="visually-hidden" for="find-keyword">키워드</label>
                <input id="find-keyword" class="form-control" type="search" placeholder="관광지 이름 (예: 죽녹원)" maxlength="30" />
                <button class="btn btn-primary" type="submit">검색</button>
              </div>
              <div class="d-flex gap-2">
                <label class="visually-hidden" for="find-sido">시도</label>
                <select id="find-sido" class="form-select form-select-sm"><option value="">시도 전체</option></select>
                <label class="visually-hidden" for="find-type">유형</label>
                <select id="find-type" class="form-select form-select-sm"></select>
              </div>
            </form>
            <ul id="find-list" class="spot-list"></ul>
          </div>

          <!-- 내 계획 -->
          <div class="tab-pane fade show active" id="pane-plan" role="tabpanel" aria-labelledby="tab-plan" tabindex="0">
            <form id="meta-form" class="p-3 vstack gap-2 border-bottom" novalidate>
              <div>
                <label for="plan-title" class="form-label small mb-1">여행 제목</label>
                <input id="plan-title" class="form-control" maxlength="40" placeholder="예: 광주 → 담양 당일 드라이브" />
                <div class="invalid-feedback"></div>
              </div>
              <div class="row g-2">
                <div class="col-6">
                  <label for="plan-date" class="form-label small mb-1">출발일</label>
                  <input id="plan-date" type="date" class="form-control" />
                </div>
                <div class="col-6">
                  <label for="plan-range" class="form-label small mb-1">주행가능거리(km)</label>
                  <input id="plan-range" type="number" class="form-control" min="50" max="1000" step="10" />
                </div>
              </div>
              <details class="ev-settings">
                <summary class="small text-body-secondary">⚡ 충전비 계산 설정</summary>
                <div class="row g-2 mt-1">
                  <div class="col-6">
                    <label for="plan-eff" class="form-label small mb-1">전비(km/kWh)</label>
                    <input id="plan-eff" type="number" class="form-control form-control-sm" min="2" max="10" step="0.1" />
                  </div>
                  <div class="col-6">
                    <label for="plan-price" class="form-label small mb-1">충전 단가(원/kWh)</label>
                    <input id="plan-price" type="number" class="form-control form-control-sm" min="0" max="1000" step="1" />
                  </div>
                </div>
                <p class="form-hint mb-0 mt-1">기본값은 예시입니다. 내 차 전비와 이용하는 충전기 단가로 바꿔 주세요.</p>
              </details>
            </form>
            <p class="small text-body-secondary px-3 pt-2 mb-0" id="dnd-hint">⋮⋮ 손잡이를 끌거나, 손잡이에 초점을 두고 Alt + ↑/↓ 로 순서를 바꿀 수 있습니다.</p>
            <ol id="stop-list" class="stop-list" aria-describedby="dnd-hint"></ol>
            <div class="plan-summary">
              <p class="fw-bold mb-1" id="sum-main"></p>
              <p class="small mb-1" id="sum-weather"></p>
              <p class="small mb-2" id="sum-range"></p>
              <table class="table table-sm small mb-3 expense-table">
                <caption class="visually-hidden">항목별 예상 경비</caption>
                <tbody id="sum-expense"></tbody>
              </table>
              <div class="d-flex flex-wrap gap-2">
                <button id="btn-save" class="btn btn-primary" type="button">계획 저장</button>
                <button id="btn-new" class="btn btn-outline-primary" type="button">새 계획</button>
                <button id="btn-export" class="btn btn-outline-secondary" type="button">MD 내보내기</button>
              </div>
            </div>
          </div>

          <!-- 저장 목록 -->
          <div class="tab-pane fade" id="pane-saved" role="tabpanel" aria-labelledby="tab-saved" tabindex="0">
            <ul id="saved-list" class="list-group list-group-flush"></ul>
          </div>
        </div>
      </section>

      <section class="app-map" aria-label="지도">
        <div class="map-legend">
          <span class="ev-dot" aria-hidden="true">⚡</span>
          <div class="form-check form-switch mb-0">
            <input class="form-check-input" type="checkbox" role="switch" id="ev-toggle" checked />
            <label class="form-check-label" for="ev-toggle">충전소 표시</label>
          </div>
          <label class="visually-hidden" for="ev-connector">커넥터</label>
          <select id="ev-connector" class="form-select form-select-sm w-auto"></select>
          <span id="ev-source" class="badge text-bg-light border ev-badge"></span>
        </div>
        <div id="map" class="map"></div>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="assets/js/core/layout.js"></script>
    <script type="module" src="assets/js/pages/plan.js"></script>
  </body>
</html>
