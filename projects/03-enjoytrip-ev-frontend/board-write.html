<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>글쓰기 · EnjoyTrip EV</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" />
    <link rel="stylesheet" href="assets/css/style.css" />
  </head>
  <body>
    <header id="app-header"></header>

    <main class="page-wrap" style="max-width: 800px">
      <p class="small fw-medium text-primary mb-1" id="board-label"></p>
      <h1 class="page-title mb-4" id="form-title">글쓰기</h1>
      <form id="post-form" class="vstack gap-3" novalidate>
        <div>
          <label for="title" class="form-label">제목</label>
          <input id="title" class="form-control" maxlength="100" required placeholder="제목을 입력하세요 (최대 100자)" />
          <div class="invalid-feedback"></div>
        </div>
        <div>
          <label for="content" class="form-label">내용</label>
          <textarea id="content" class="form-control" rows="14" maxlength="2000" required placeholder="여행 후기, 충전 팁을 자유롭게 남겨 주세요."></textarea>
          <div class="invalid-feedback"></div>
          <p class="form-hint text-end mt-1 mb-0"><span id="count">0</span> / 2000</p>
        </div>
        <div class="d-flex gap-2">
          <button class="btn btn-primary" type="submit" id="btn-submit">등록</button>
          <a class="btn btn-outline-secondary" id="btn-cancel" href="board.html">취소</a>
        </div>
      </form>
    </main>

    <footer id="app-footer"></footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="assets/js/core/layout.js"></script>
    <script type="module" src="assets/js/pages/board-write.js"></script>
  </body>
</html>
