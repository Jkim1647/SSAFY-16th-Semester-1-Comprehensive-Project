<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>관광지 조회 · EnjoyTrip EV</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" />
    <link rel="stylesheet" href="assets/css/style.css" />
  </head>
  <body>
    <header id="app-header"></header>

    <main class="app-shell">
      <!-- 왼쪽: 검색 조건 + 결과 목록 -->
      <section class="app-panel" aria-labelledby="panel-title">
        <div class="app-panel__head">
          <h1 id="panel-title" class="h5 fw-bold mb-3">관광지 조회</h1>
          <form id="search-form" class="vstack gap-2" role="search">
            <div class="input-group">
              <label class="visually-hidden" for="keyword">키워드</label>
              <input id="keyword" class="form-control" type="search" placeholder="관광지 이름으로 검색 (예: 무등산)" maxlength="30" />
              <button class="btn btn-primary" type="submit">검색</button>
            </div>
            <div class="d-flex gap-2">
              <label class="visually-hidden" for="sido">시도</label>
              <select id="sido" class="form-select form-select-sm">
                <option value="">시도 전체</option>
              </select>
              <label class="visually-hidden" for="gugun">구군</label>
              <select id="gugun" class="form-select form-select-sm" disabled>
                <option value="">구군 전체</option>
              </select>
            </div>
            <fieldset>
              <legend class="visually-hidden">콘텐츠 유형</legend>
              <div id="type-chips" class="chip-row"></div>
            </fieldset>
          </form>
        </div>
        <div class="app-panel__body">
          <p id="result-meta" class="result-meta mb-0" aria-live="polite"></p>
          <ul id="spot-list" class="spot-list"></ul>
          <div class="p-3">
            <button id="btn-more" class="btn btn-outline-secondary w-100 d-none" type="button">더 보기</button>
          </div>
        </div>
      </section>

      <!-- 오른쪽: 지도 -->
      <section class="app-map" aria-label="지도">
        <span id="source-badge" class="map-badge"></span>
        <div id="map" class="map"></div>
      </section>
    </main>

    <!-- 상세 보기 (오프캔버스) -->
    <div class="offcanvas offcanvas-end" tabindex="-1" id="detail" aria-labelledby="detail-title">
      <div class="offcanvas-header border-bottom">
        <h2 class="offcanvas-title h5 fw-bold" id="detail-title"></h2>
        <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="닫기"></button>
      </div>
      <div class="offcanvas-body" id="detail-body"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="assets/js/core/layout.js"></script>
    <script type="module" src="assets/js/pages/attraction.js"></script>
  </body>
</html>
