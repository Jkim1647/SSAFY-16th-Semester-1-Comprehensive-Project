<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>게시판 · EnjoyTrip EV</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" />
    <link rel="stylesheet" href="assets/css/style.css" />
  </head>
  <body>
    <header id="app-header"></header>

    <main class="page-wrap" style="max-width: 1000px">
      <div class="d-flex flex-column flex-md-row align-items-md-end gap-3 mb-3">
        <div class="flex-fill">
          <h1 class="page-title mb-1" id="board-title">게시판</h1>
          <p class="small text-body-secondary mb-0" id="board-desc"></p>
        </div>
        <form id="search-form" class="d-flex gap-2" role="search">
          <label class="visually-hidden" for="q">검색어</label>
          <input id="q" class="form-control" type="search" placeholder="제목·내용 검색" maxlength="30" />
          <button class="btn btn-outline-primary text-nowrap" type="submit">검색</button>
          <a id="btn-write" class="btn btn-primary text-nowrap d-none" href="#">글쓰기</a>
        </form>
      </div>

      <div class="table-responsive">
        <table class="table board-table table-hover mb-3">
          <caption class="visually-hidden">게시글 목록</caption>
          <thead>
            <tr>
              <th scope="col" style="width: 4rem">번호</th>
              <th scope="col">제목</th>
              <th scope="col" style="width: 8rem">작성자</th>
              <th scope="col" style="width: 7rem">작성일</th>
              <th scope="col" style="width: 4rem">조회</th>
            </tr>
          </thead>
          <tbody id="post-rows"></tbody>
        </table>
      </div>
      <nav aria-label="페이지 이동"><ul class="pagination pagination-sm" id="pager"></ul></nav>
    </main>

    <footer id="app-footer"></footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="assets/js/core/layout.js"></script>
    <script type="module" src="assets/js/pages/board-list.js"></script>
  </body>
</html>
