<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>비밀번호 찾기 · EnjoyTrip EV</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" />
    <link rel="stylesheet" href="assets/css/style.css" />
  </head>
  <body>
    <header id="app-header"></header>

    <main class="auth-wrap">
      <h1 class="mb-1">비밀번호 찾기</h1>
      <p class="text-body-secondary mb-4">가입할 때 입력한 아이디와 이메일을 확인한 뒤 새 비밀번호를 설정합니다.</p>

      <div id="form-alert" class="alert alert-danger d-none" role="alert"></div>

      <!-- 1단계: 본인 확인 -->
      <form id="verify-form" novalidate>
        <div class="mb-3">
          <label for="id" class="form-label">아이디</label>
          <input id="id" class="form-control" autocomplete="username" required />
          <div class="invalid-feedback"></div>
        </div>
        <div class="mb-4">
          <label for="email" class="form-label">이메일</label>
          <input id="email" type="email" class="form-control" autocomplete="email" required />
          <div class="invalid-feedback"></div>
        </div>
        <button class="btn btn-primary w-100 py-2" type="submit">확인</button>
      </form>

      <!-- 2단계: 재설정 -->
      <form id="reset-form" class="d-none" novalidate>
        <div class="mb-3">
          <label for="new-password" class="form-label">새 비밀번호</label>
          <input id="new-password" type="password" class="form-control" autocomplete="new-password" maxlength="20" required />
          <div class="invalid-feedback"></div>
          <div class="form-hint mt-1">영문과 숫자를 포함한 8~20자</div>
        </div>
        <div class="mb-4">
          <label for="new-password2" class="form-label">새 비밀번호 확인</label>
          <input id="new-password2" type="password" class="form-control" autocomplete="new-password" maxlength="20" required />
          <div class="invalid-feedback"></div>
        </div>
        <button class="btn btn-primary w-100 py-2" type="submit">비밀번호 변경</button>
      </form>

      <p class="small text-center mt-3"><a href="login.html">로그인으로 돌아가기</a></p>
    </main>

    <footer id="app-footer"></footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="assets/js/core/layout.js"></script>
    <script type="module" src="assets/js/pages/find-password.js"></script>
  </body>
</html>
