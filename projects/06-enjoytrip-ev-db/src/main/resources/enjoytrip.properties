# 기본 설정. 같은 키를 환경변수(ENJOYTRIP_ + 대문자, 점은 밑줄)나 -D 시스템 속성으로 덮어쓸 수 있다.
#   예) ENJOYTRIP_DB_PASSWORD=...  /  -Denjoytrip.queue=kafka

# 수업 실습 기본 계정(ssafy/ssafy). 데이터베이스는 없으면 자동으로 만든다.
db.url=jdbc:mysql://localhost:3306/enjoytrip?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&createDatabaseIfNotExist=true&rewriteBatchedStatements=true
db.user=ssafy
db.password=ssafy

# 비밀번호 해시 pepper. 운영에서는 반드시 환경변수로 바꾼다.
security.pepper=enjoytrip-dev-pepper-change-me
# PBKDF2 반복 횟수 (OWASP 권고 600,000)
security.iterations=600000

# 비밀번호 재설정 링크의 기준 주소 (예: https://enjoytrip.example.com/enjoytrip). 배포할 때 반드시 설정한다.
# 비워 두면 localhost/127.0.0.1 로 접속한 개발 환경에서만 요청 주소로 만들고, 그 밖의 Host 로 온 요청은 거부한다.
app.base-url=

# 처음 실행할 때 만드는 관리자 계정. 비밀번호를 비워 두면 만들지 않는다.
admin.email=admin@enjoytrip.kr
admin.password=

# 충전 예약 시뮬레이션 이벤트 큐: memory | kafka
enjoytrip.queue=memory
kafka.bootstrap=localhost:9092
kafka.topic=ev-reservation-requests

# 핫플레이스 사진 저장 폴더 (비우면 ~/enjoytrip-uploads)
upload.dir=
