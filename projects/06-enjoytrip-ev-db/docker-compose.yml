# 시뮬레이션의 Kafka 큐를 쓸 때만 필요하다 (기본값은 메모리 큐라 없어도 앱은 동작한다).
#   docker compose up -d      → localhost:9092 에 단일 노드 Kafka(KRaft) 실행
#   시뮬레이션 화면에서 "대기열(큐) = Kafka" 를 고르면 토픽 ev-reservation-requests(파티션 8)를 자동으로 만든다.
services:
  kafka:
    image: apache/kafka:4.1.0
    container_name: enjoytrip-kafka
    ports:
      - "9092:9092"
